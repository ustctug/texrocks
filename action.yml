---
name: Deploy Action
description: A custom deploy action for the project
inputs:
  target:
    description: Deployment target
    required: true
  version:
    description: Lua version
    default: "5.3"
runs:
  using: composite
  steps:
    - run: |
        scripts/deploy.sh ${{ inputs.target }}
      shell: bash
      env:
        LUA_VERSION: ${{ inputs.version }}
