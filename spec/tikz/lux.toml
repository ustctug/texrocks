package = "demo-tikz"
version = "0.3.12"
lua = ">=5.1"

[description]
summary = "Example for tikz"
maintainer = "Wu"
labels = ["texmf"]
homepage = "https://texrocks.readthedocs.io/en/latest/topics/demo-tikz.md.html"
license = "GPL-3.0"

[build_dependencies]
lualatex = ">=0.3.16"
pgf = ">=3.1.10"
hyperref = ">=7.1-18"
hologo = ">=1.15"
standalone = ">=1.5"

[run]
type = "command"
command = "lx"
args = ["--tree=.lux", "doc", "demo-tikz"]

[build]
type = "command"
build_command = "lualatex --interaction=nonstopmode main.tex"

[build.install.conf]
'../doc/main.pdf' = 'main.pdf'
