---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -y update
          sudo apt-get -y install libreadline-dev
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{secrets.LUAROCKS_API_KEY}}
          HISTORY_INCDIR: /usr/include
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
          READLINE_INCDIR: /usr/include
          READLINE_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          template: assets/lua/template.lua
