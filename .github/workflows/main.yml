---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libreadline-dev
      - uses: actions/checkout@v7
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          lua_version: "5.3"
          lux_version: latest
          # for luatex/lualatex/luatexinfo/initex
          # luahbtex versions of build/run time must be same
          # (Fatal format file error; I'm stymied)
          # so pin versions:
          # 1. luahbtex -> texrocks
          # 2. texrocks -> luatex/lualatex/luatexinfo/initex
          dependencies: |
            luahbtex == 1.27.11
            argparse
            lua-cjson
            prompt-style >= 0.1.3
            datafile
      - name: Pack
        env:
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
        run: |
          lx --lua-version=5.3 pack
      - uses: actions/upload-artifact@v7
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          path: |
            *.rock
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
