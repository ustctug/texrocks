---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

# Prevent concurrent auto-commits
concurrency:
  group: auto-commit-linux-x86_64
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
          # - windows-latest
    runs-on: ${{matrix.runs-on}}
    steps:
      - name: Install MSVC Compiler Toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "5.3"
      - uses: lumen-oss/gh-actions-lux@v1
      - name: Install Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          echo "PKG_CONFIG_PATH=$(brew --prefix readline)/lib/pkgconfig:\
          $PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libreadline-dev
      - name: Pack
        env:
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
        run: |
          lx --lua-version=5.3 pack luaprompt
          lx --lua-version=5.3 pack luafilesystem
          lx --lua-version=5.3 pack lua-cjson
          lx --lua-version=5.3 --no-manifest-cache pack luahbtex
          lx --lua-version=5.3 --no-manifest-cache pack bibtex
          lx --lua-version=5.3 --no-manifest-cache pack makeindex
          rustup component add rust-src
          lx --lua-version=5.3 pack minijinja-lua
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.runs-on }}
          path: |
            *.rock

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "5.3"
      - uses: luarocks/gh-actions-luarocks@v6
      - name: Install Dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install liblua5.3-dev rename libreadline-dev
          # https://github.com/luarocks/luarocks/issues/1817
          echo local_by_default = true >>\
          ~/work/texrocks/texrocks/.luarocks/etc/luarocks/config-5.3.lua
          luarocks config variables.ZIP rpzip
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: gh-pages
      - name: Clean old rocks
        run: |
          rm -f ./*.rock
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
      - name: Install rocks
        run: |
          for rock in ./*.linux-x86_64.rock; do
            luarocks install "$rock"
          done
      - uses: ustctug/texrocks@main
        env:
          TEXMFDOTDIR: .;~/.luarocks/lib/luarocks/rocks-5.3//
          CXXFLAGS: -I/home/runner/work/texrocks/texrocks/.lua/include
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          target: >
            rpzip
            texdef
            luatex
            luatexinfo
            lualatex
            texdoc
            light-latex-make
            markdown2tex
            citation-style-language
            cm-unicode
            fourier
            mpfonts
            multirow
            ulem
            jknappen
            ncctools
            yhmath
            bigfoot
            changepage
            graphics-pln
            standalone
            hologo
            luadraw
            beamerswitch
            sjtubeamer
            ctex
            babel-base
            hypdoc
            ydoc
            algorithms
            subfig
            cite
            sttools
            ieeetran
            preprint
            booktabs
            makecell
            epstopdf-pkg
            listingsutf8
            fontawesome5
            hyperxmp
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: gh-pages
          commit_message: 'chore: update build artifacts'
          file_pattern: index.html manifest* *.rock
          commit_options: --amend --no-edit
          push_options: --force
