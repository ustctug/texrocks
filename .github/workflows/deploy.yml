---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

# Prevent concurrent auto-commits
concurrency:
  group: auto-commit-linux-x86_64
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-latest
          # - windows-latest
    runs-on: ${{matrix.runs-on}}
    steps:
      - name: Install MSVC Compiler Toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.3"
      - uses: luarocks/gh-actions-luarocks@v6
      - name: Install Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
      - name: Install Dependencies
        # CMake Error:
        # Could NOT find Lua (missing: LUA_LIBRARIES LUA_INCLUDE_DIR)
        run: |
          luarocks config variables.ZIP rpzip
          luarocks install rpzip
          luarocks install luahbtex \
            --server=https://ustctug.github.io/texrocks
          # luarocks install nvim-textmate \
          #   --server=https://ustctug.github.io/texrocks
          luarocks install ltreesitter \
            --server=https://ustctug.github.io/texrocks
          luarocks install lua-template
          luarocks pack lua-zlib
          luarocks pack luafilesystem
          luarocks pack luahbtex
          # luarocks pack nvim-textmate
          luarocks pack ltreesitter
          luarocks pack lua-template
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{matrix.runs-on}}
          path: |
            *.rock

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{secrets.GH_TOKEN}}
          ref: gh-pages
      - uses: actions/checkout@v4
        with:
          token: ${{secrets.GH_TOKEN}}
          path: texrocks
      - uses: actions/setup-go@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.3"
      - uses: luarocks/gh-actions-luarocks@v6
      - name: Install Dependencies
        run: |
          gem install rake
          sudo apt-get -y update
          sudo apt-get -y install rename liblua5.3-dev
          rm -f ./*.rock
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
      - env:
          TEXMFDOTDIR: .;~/.luarocks/lib/luarocks/rocks-5.3//
          CGO_CFLAGS: -I/home/runner/work/texrocks/texrocks/.lua/include
          CXXFLAGS: -I/home/runner/work/texrocks/texrocks/.lua/include
        run: |
          texrocks/scripts/deploy.sh
          rm -r texrocks
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: gh-pages
          commit_message: 'chore: update build artifacts'
          file_pattern: index.html manifest* *.rock
          commit_options: --amend --no-edit
          push_options: --force
