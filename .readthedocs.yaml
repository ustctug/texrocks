# https://docs.readthedocs.io/en/stable/config-file/v2.html
---
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3"
  commands:
    - asdf plugin add lua
    - asdf install lua 5.1
    # full path can declare lua version
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks config rocks_servers.1 \
      https://lumen-oss.github.io/rocks-binaries
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install ldoc-temp
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install texcat
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install tree-sitter-comment
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install tree-sitter-bash
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install tree-sitter-latex
    # rockspec
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install tree-sitter-lua
    # lux.toml
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install tree-sitter-toml
    # texdoc
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install tree-sitter-ini
    # graphdrawing
    - ~/.asdf/installs/lua/5.1/luarocks/bin/luarocks install tree-sitter-dot
    - git clone --depth=1 https://github.com/pstray/rename
    - cd rename && perl Makefile.PL
    - make -C rename
    - install -D rename/bin/rename -t ~/.asdf/installs/lua/5.1/luarocks/bin
    - scripts/ldoc.sh
