# https://docs.readthedocs.io/en/stable/config-file/v2.html
---
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3"
  commands:
    - asdf plugin add rust
    - asdf install rust latest
    - asdf global rust latest
    - asdf plugin add lua
    - asdf install lua 5.1
    - asdf global lua 5.1
    - echo "\n"'rocks_servers = { "https://lumen-oss.github.io/rocks-binaries",
      "https://luarocks.org" }' >>
      ~/.asdf/installs/lua/5.1/luarocks/etc/luarocks/config-5.1.lua
    - cat ~/.asdf/installs/lua/5.1/luarocks/etc/luarocks/config-5.1.lua
    - luarocks install ldoc-temp
    - luarocks install texcat
    - luarocks install tree-sitter-comment
    - luarocks install tree-sitter-bash
    - luarocks install tree-sitter-latex
    # rockspec
    - luarocks install tree-sitter-lua
    # lux.toml
    - luarocks install tree-sitter-toml
    # texdoc
    - luarocks install tree-sitter-ini
    # graphdrawing
    - luarocks install tree-sitter-dot
    - git clone --depth=1 https://github.com/pstray/rename
    - cd rename && perl Makefile.PL
    - make -C rename
    - install -D rename/bin/rename -t ~/.asdf/installs/lua/5.1/luarocks/bin
    - scripts/ldoc.sh
