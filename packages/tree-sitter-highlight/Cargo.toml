[workspace]
resolver = "2"
members = [
  "crates/highlight",
  "crates/lua-tree-sitter-highlight",
]

[workspace.package]
version = "0.1.0"
authors = ["Tree-sitter contributors"]
edition = "2024"
rust-version = "1.90"
description = "Syntax highlighting with Tree-sitter"
homepage = "https://tree-sitter.github.io/tree-sitter"
repository = "https://github.com/tree-sitter/tree-sitter"
license = "MIT"
categories = ["parsing", "text-editors"]

# `tree-sitter` and `tree-sitter-loader` come from crates.io (not the vendored
# `tree-sitter/` tree, which exists only for reference). The copied
# `crates/highlight` keeps the local Renderer/TeX changes that do not exist
# upstream, and depends on the crates.io core `tree-sitter` lib.
[workspace.dependencies]
tree-sitter = "0.26.12"
tree-sitter-config = "0.26.12"
tree-sitter-highlight = { path = "crates/highlight" }
tree-sitter-loader = "0.26.12"

ansi_colours = "1.2.3"
anstyle = "1.0.14"
mlua = { version = "0.10", features = ["module"] }
regex = "1.12.3"
serde_json = { version = "1.0.150", features = ["preserve_order"] }
streaming-iterator = "0.1.9"
thiserror = "2.0.18"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
if_not_else = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
similar_names = "allow"
string_lit_as_bytes = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
tuple_array_conversions = "allow"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"
