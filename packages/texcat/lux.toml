package = "texcat"
version = "0.3.14"
lua = ">=5.1"

[description]
summary = "syntax highlight code in LaTeX"
detailed = "A reimplementation of https://pygments.org/docs/formatters/#LatexFormatter by texlua"
maintainer = "Wu"
labels = ["tex"]
homepage = "https://texrocks.readthedocs.io/en/latest/topics/texcat.md.html"
license = "GPL-3.0"

[source]
url = "https://github.com/ustctug/texrocks/archive/$(VERSION).zip"
dir = "texrocks-$(VERSION)/packages/$(PACKAGE)"

[dependencies]
argparse = ">=0.7.1"
vim = ">=0.0.4"
lua-cjson = ">=0.0.1"
vscode-extensions = ">=1.102.3"
tree-sitter-highlight = ">=0.0.2"
"rocks-treesitter.nvim" = ">=1.3.0"
platformdirs = ">=0.2.12"
luaposix = ">=36.3"

[test_dependencies]
fancyvrb = ">=4.6"
lualatex = ">=0.3.13"
graphics-cfg = ">=0.0.1"
tree-sitter-latex = "0.0.42-1"
tree-sitter-comment = "0.0.33-1"
ldoc = ">=1.5.0"

[run]
type = "command"
command = "texcat"
args = ["--format=terminal"]

[test]
type = "command"
command = "lualatex"
flags = ["--shell-escape", "test.tex"]

[build]
type = "builtin"
