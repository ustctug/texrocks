package = "lualatex"
version = "0.3.19"
lua = ">=5.1"

[description]
summary = "lualatex for LaTeX"
maintainer = "Wu"
labels = ["texmf"]
detailed = "See https://github.com/ustctug/texrocks"
homepage = "https://www.lualatex.org/"
license = "GPL-3.0"

[source]
url = "https://github.com/ustctug/texrocks/archive/$(VERSION).zip"
dir = "texrocks-$(VERSION)/packages/$(PACKAGE)"

# refer https://ctan.org/pkg/required
[dependencies]
texrocks = "0.3.19"
amsfonts = ">=3.4"
luaotfload = ">=3.29"
lm = ">=2.5"
# lua-uni-algos 0.5 provide lua-uni-data.lua for expl3.sty of l3kernel 2026.8.10
lua-uni-algos = ">=0.5"
# tex-ini-files provide lualatexquotejobname.lua
tex-ini-files = ">=2026.3.27"
# latex-base depends on l3kernel depends on unicode-data
latex-base = ">=2026.6.1"
# Package: expl3 2026-09-09 L3 programming layer (loader)
#
#
# ! LaTeX Error: Mismatched LaTeX support files detected.
# (LaTeX)        Loading 'expl3.sty' aborted!
# (LaTeX)
# (LaTeX)        The L3 programming layer in the LaTeX format
# (LaTeX)        is dated 2026-08-10, but in your TeX tree the files require
# (LaTeX)        at least 2026-09-09.
l3kernel = "2026.9.9"

[build_dependencies]
texrocks = "0.3.19"
amsfonts = ">=3.4"
latex-fonts = ">=0.0.1"
lua-uni-algos = ">=0.5"
tex-ini-files = "2026.3.27"
# glyphtounicode.tex
latex-support = "2026.6.1"
# glyphtounicode-cmex.tex
latex-base = "2026.6.1"
l3kernel = "2026.9.9"

[run]
command = "lualatex"

[test]
type = "command"
command = "lualatex"
flags = ["test.tex"]

[deploy]
wrap_bin_scripts = false

[build]
type = "command"
build_command = "bin/lualatex --ini --interaction=nonstopmode lualatex.ini"

[build.install.conf]
"../web2c/luahbtex/lualatex.fmt" = "lualatex.fmt"

[build.install.bin]
lualatex = "bin/lualatex"
